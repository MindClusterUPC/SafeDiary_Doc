07" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Un cargo único por reserva o suscripción.</text><rect x="612" y="423" width="368" height="50" rx="0" fill="#fff" stroke="#969696" stroke-width="2" stroke-dasharray="7 6"/><text x="624" y="444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#202020" text-anchor="start">Pago de cita</text><text x="624" y="465" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Cobro vinculado a una reserva vigente.</text><rect x="612" y="481" width="368" height="50" rx="0" fill="#fff" stroke="#969696" stroke-width="2" stroke-dasharray="7 6"/><text x="624" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#202020" text-anchor="start">Suscripción Premium</text><text x="624" y="523" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Derecho temporal tras pago confirmado.</text><rect x="612" y="539" width="368" height="70" rx="0" fill="#fff" stroke="#969696" stroke-width="2" stroke-dasharray="7 6"/><text x="624" y="560" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#202020" text-anchor="start">Saldo disponible</text><text x="624" y="581" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Ingresos de sesiones menos comisiones y</text><text x="624" y="600" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">retiros.</text><rect x="612" y="617" width="368" height="50" rx="0" fill="#fff" stroke="#969696" stroke-width="2" stroke-dasharray="7 6"/><text x="624" y="638" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#202020" text-anchor="start">Retiro</text><text x="624" y="659" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Transferencia confirmada por la pasarela.</text><text x="607" y="725" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020" text-anchor="start">Business Decisions</text><text x="615" y="749" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#7c7c7c" text-anchor="start">Key rules, policies and decisions</text><rect x="613" y="764" width="364" height="271" rx="0" fill="#e3d5f2" stroke="#a887ce" stroke-width="5"/><text x="625" y="786" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• La pasarela firma y confirma todo</text><text x="642" y="805" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">resultado de pago.</text><text x="625" y="830" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• La misma reserva solo genera un cargo</text><text x="642" y="849" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">efectivo.</text><text x="625" y="874" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• Premium no confirma citas ni aumenta el</text><text x="642" y="893" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">saldo del psicólogo.</text><text x="625" y="918" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• El retiro no excede el saldo disponible.</text><text x="625" y="943" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• Pagos tardíos se concilian o devuelven;</text><text x="642" y="962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">no crean cita.</text><text x="28" y="1077" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#7c7c7c" text-anchor="start">Azul: command  ·  Naranja: event  ·  Verde: query  ·  Morado: policy</text></svg>