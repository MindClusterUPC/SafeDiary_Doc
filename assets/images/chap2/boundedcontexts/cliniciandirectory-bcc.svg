ont-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Valoración asociada a una única cita</text><text x="624" y="582" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">completada.</text><rect x="612" y="599" width="368" height="50" rx="0" fill="#fff" stroke="#969696" stroke-width="2" stroke-dasharray="7 6"/><text x="624" y="620" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#202020" text-anchor="start">Valoración agregada</text><text x="624" y="641" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Resultado calculado con reseñas elegibles.</text><text x="607" y="707" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020" text-anchor="start">Business Decisions</text><text x="615" y="731" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#7c7c7c" text-anchor="start">Key rules, policies and decisions</text><rect x="613" y="746" width="364" height="289" rx="0" fill="#e3d5f2" stroke="#a887ce" stroke-width="5"/><text x="625" y="768" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• Solo una ficha verificada puede</text><text x="642" y="787" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">publicarse.</text><text x="625" y="812" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• Una cita completada admite una reseña por</text><text x="642" y="831" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">paciente.</text><text x="625" y="856" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• Las tarifas nuevas no alteran reservas ya</text><text x="642" y="875" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">aceptadas.</text><text x="625" y="900" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• Las credenciales y datos clínicos nunca</text><text x="642" y="919" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">son públicos.</text><text x="28" y="1077" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#7c7c7c" text-anchor="start">Azul: command  ·  Naranja: event  ·  Verde: query  ·  Morado: policy</text></svg>