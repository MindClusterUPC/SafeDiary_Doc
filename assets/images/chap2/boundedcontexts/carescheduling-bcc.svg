l="#eee6ff" stroke="#7650c8" stroke-width="3"/><text x="1364" y="723" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020" text-anchor="start">Clinician</text><text x="1364" y="743" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020" text-anchor="start">Directory</text><rect x="585" y="288" width="421" height="770" rx="0" fill="#fff" stroke="#8f8f8f" stroke-width="7"/><text x="606" y="328" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020" text-anchor="start">Ubiquitous Language</text><text x="615" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#7c7c7c" text-anchor="start">Context-specific domain terminology</text><rect x="612" y="365" width="368" height="50" rx="0" fill="#fff" stroke="#969696" stroke-width="2" stroke-dasharray="7 6"/><text x="624" y="386" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#202020" text-anchor="start">Solicitud de contacto</text><text x="624" y="407" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Inicio de coordinación sin crear una cita.</text><rect x="612" y="423" width="368" height="50" rx="0" fill="#fff" stroke="#969696" stroke-width="2" stroke-dasharray="7 6"/><text x="624" y="444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#202020" text-anchor="start">Propuesta de horario</text><text x="624" y="465" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Fecha, hora y zona horaria ofrecidas.</text><rect x="612" y="481" width="368" height="70" rx="0" fill="#fff" stroke="#969696" stroke-width="2" stroke-dasharray="7 6"/><text x="624" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#202020" text-anchor="start">Reserva temporal</text><text x="624" y="523" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Retención exclusiva del horario durante una</text><text x="624" y="542" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">hora.</text><rect x="612" y="559" width="368" height="70" rx="0" fill="#fff" stroke="#969696" stroke-width="2" stroke-dasharray="7 6"/><text x="624" y="580" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#202020" text-anchor="start">Cita confirmada</text><text x="624" y="601" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">Reserva con pago aprobado y participantes</text><text x="624" y="620" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">definidos.</text><text x="607" y="700" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020" text-anchor="start">Business Decisions</text><text x="615" y="724" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#7c7c7c" text-anchor="start">Key rules, policies and decisions</text><rect x="613" y="739" width="364" height="296" rx="0" fill="#e3d5f2" stroke="#a887ce" stroke-width="5"/><text x="625" y="761" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• Un horario no se retiene para dos</text><text x="642" y="780" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">solicitudes.</text><text x="625" y="805" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• La retención expira después de una hora</text><text x="642" y="824" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">sin pago.</text><text x="625" y="849" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• Solo el pago aprobado confirma la cita.</text><text x="625" y="874" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• La reunión admite participantes</text><text x="642" y="893" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">autorizados y fecha válida.</text><text x="625" y="918" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020" text-anchor="start">• El diario exige consentimiento explícito</text><text x="642" y="937" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020" text-anchor="start">y vigente.</text><text x="28" y="1077" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#7c7c7c" text-anchor="start">Azul: command  ·  Naranja: event  ·  Verde: query  ·  Morado: policy</text></svg>