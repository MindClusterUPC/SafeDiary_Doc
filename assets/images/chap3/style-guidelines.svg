<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="930" viewBox="0 0 1100 930" role="img" aria-labelledby="title desc">
  <title id="title">SafeDiary · Style Guidelines</title>
  <desc id="desc">Lámina de referencia con identidad visual, tipografía, paleta y componentes de SafeDiary basada en los seis wireflows móviles.</desc>
  <defs>
    <style>
      .font { font-family: 'Roboto Flex', Arial, sans-serif; }
      .navy { fill: #01284B; }
      .ink { fill: #0D2142; }
      .muted { fill: #64748B; }
      .teal { fill: #006B5F; }
      .small { font-size: 15px; }
      .label { font-size: 17px; font-weight: 650; }
      .section { font-size: 22px; font-weight: 700; }
      .shadow { filter: url(#shadow); }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#01284B" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1100" height="930" fill="#F9F9FF"/>
  <rect width="1100" height="91" fill="#01284B"/>
  <rect x="39" y="23" width="45" height="45" rx="11" fill="#153A59"/>
  <path d="M49 47h8l4-10 5 22 5-14h5" fill="none" stroke="#35BEAB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="font" x="98" y="55" font-size="28" font-weight="750" fill="white">SafeDiary</text>
  <text class="font" x="748" y="51" font-size="20" font-weight="600" fill="#DFF5EF">STYLE GUIDELINES · MOBILE</text>
  <text class="font" x="41" y="126" font-size="17" fill="#64748B">Referencia visual normalizada a partir de los wireflows 1–6</text>

  <rect class="shadow" x="40" y="151" width="496" height="170" rx="20" fill="white"/>
  <text class="font section ink" x="62" y="187">Marca y tono</text>
  <rect x="62" y="208" width="52" height="52" rx="12" fill="#01284B"/>
  <path d="M70 235h8l4-9 5 19 5-12h11" fill="none" stroke="#35BEAB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="font navy" x="130" y="240" font-size="23" font-weight="750">SafeDiary</text>
  <text class="font muted" x="62" y="282" font-size="16">Serena · cercana · privada · clínicamente responsable</text>
  <text class="font muted" x="62" y="304" font-size="15">Acompaña decisiones; no emite diagnósticos.</text>

  <rect class="shadow" x="555" y="151" width="505" height="170" rx="20" fill="white"/>
  <text class="font section ink" x="577" y="187">Tipografía · Roboto Flex</text>
  <text class="font navy" x="577" y="226" font-size="24" font-weight="700">Título de pantalla / 24 px</text>
  <text class="font ink" x="577" y="252" font-size="18" font-weight="700">Encabezado de sección / 18 px</text>
  <text class="font ink" x="577" y="278" font-size="15">Texto de cuerpo / 14–16 px · altura 1.4</text>
  <text class="font muted" x="577" y="302" font-size="13">Ayuda y metadatos / 12 px mínimo</text>

  <text class="font section ink" x="40" y="365">Paleta de interfaz</text>

  <g class="font">
    <rect x="40" y="387" width="242" height="102" rx="15" fill="#F9F9FF" stroke="#E3E8F0"/>
    <text class="label ink" x="57" y="422">Fondo</text><text class="small muted" x="57" y="449">#F9F9FF</text><text class="small muted" x="57" y="473">Superficie principal</text>

    <rect x="297" y="387" width="242" height="102" rx="15" fill="white" stroke="#E3E8F0"/>
    <text class="label ink" x="314" y="422">Tarjeta</text><text class="small muted" x="314" y="449">#FFFFFF</text><text class="small muted" x="314" y="473">Lectura y formularios</text>

    <rect x="554" y="387" width="242" height="102" rx="15" fill="#01284B"/>
    <text class="label" x="571" y="422" fill="white">Azul marino</text><text class="small" x="571" y="449" fill="#DDE9F5">#01284B</text><text class="small" x="571" y="473" fill="#DDE9F5">Acción principal</text>

    <rect x="811" y="387" width="249" height="102" rx="15" fill="#006B5F"/>
    <text class="label" x="828" y="422" fill="white">Verde petróleo</text><text class="small" x="828" y="449" fill="#DFF5EF">#006B5F</text><text class="small" x="828" y="473" fill="#DFF5EF">Activo y confirmado</text>

    <rect x="40" y="505" width="242" height="102" rx="15" fill="#F0F3FF" stroke="#E3E8F0"/>
    <text class="label ink" x="57" y="540">Azul suave</text><text class="small muted" x="57" y="567">#F0F3FF</text><text class="small muted" x="57" y="591">Panel secundario</text>

    <rect x="297" y="505" width="242" height="102" rx="15" fill="#DFF5EF"/>
    <text class="label teal" x="314" y="540">Menta</text><text class="small teal" x="314" y="567">#DFF5EF</text><text class="small teal" x="314" y="591">Éxito y privacidad</text>

    <rect x="554" y="505" width="242" height="102" rx="15" fill="#0D2142"/>
    <text class="label" x="571" y="540" fill="white">Texto principal</text><text class="small" x="571" y="567" fill="#DDE9F5">#0D2142</text><text class="small" x="571" y="591" fill="#DDE9F5">Lectura y títulos</text>

    <rect x="811" y="505" width="249" height="102" rx="15" fill="#C92327"/>
    <text class="label" x="828" y="540" fill="white">Riesgo</text><text class="small" x="828" y="567" fill="#FFE8E8">#C92327</text><text class="small" x="828" y="591" fill="#FFE8E8">Eliminar y cancelar</text>
  </g>

  <text class="font section ink" x="40" y="657">Componentes y estados</text>
  <rect class="shadow" x="40" y="679" width="327" height="194" rx="20" fill="white"/>
  <text class="font label ink" x="59" y="711">Acciones</text>
  <rect x="59" y="727" width="286" height="46" rx="23" fill="#01284B"/>
  <text class="font" x="202" y="756" text-anchor="middle" font-size="15" font-weight="650" fill="white">Solicitar contacto</text>
  <rect x="59" y="786" width="286" height="46" rx="23" fill="#DEE9FF"/>
  <text class="font navy" x="202" y="815" text-anchor="middle" font-size="15" font-weight="650">Ver perfil</text>
  <text class="font small muted" x="59" y="855">Alto táctil mínimo: 48 px</text>

  <rect class="shadow" x="386" y="679" width="327" height="194" rx="20" fill="white"/>
  <text class="font label ink" x="405" y="711">Ficha verificada</text>
  <circle cx="440" cy="757" r="27" fill="#DCE7F6"/>
  <text class="font navy" x="440" y="763" font-size="15" font-weight="700" text-anchor="middle">LG</text>
  <text class="font navy" x="481" y="751" font-size="17" font-weight="700">Dra. Laura Gómez</text>
  <text class="font small muted" x="481" y="774">Psicóloga clínica · TCC</text>
  <rect x="405" y="797" width="136" height="28" rx="14" fill="#DFF5EF"/>
  <text class="font teal" x="473" y="816" text-anchor="middle" font-size="13" font-weight="650">✓ Verificada</text>
  <text class="font small muted" x="405" y="854">Tarifa y disponibilidad claras</text>

  <rect class="shadow" x="732" y="679" width="328" height="194" rx="20" fill="white"/>
  <text class="font label ink" x="751" y="711">Formulario y estado</text>
  <rect x="751" y="727" width="289" height="46" rx="12" fill="#F9F9FF" stroke="#E3E8F0"/>
  <text class="font small muted" x="766" y="756">Escribe un comentario…</text>
  <rect x="751" y="789" width="133" height="29" rx="14.5" fill="#DFF5EF"/>
  <text class="font teal" x="817" y="809" text-anchor="middle" font-size="13" font-weight="650">✓ Confirmada</text>
  <rect x="896" y="789" width="144" height="29" rx="14.5" fill="#FDEBEC"/>
  <text class="font" x="968" y="809" text-anchor="middle" font-size="13" font-weight="650" fill="#C92327">Pago fallido</text>
  <text class="font small muted" x="751" y="854">Icono + texto; nunca solo color</text>

  <text class="font" x="40" y="909" font-size="15" fill="#64748B">Guía para pacientes y profesionales · Contraste AA en las combinaciones de texto definidas en el documento.</text>
</svg>
